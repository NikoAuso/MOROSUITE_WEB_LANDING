<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="Immagine segnaposto">
  <defs>
    <linearGradient id="ph-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <pattern id="ph-stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="none" />
      <rect width="4" height="8" fill="#ffffff" opacity="0.35" />
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#ph-bg)" />
  <rect width="100" height="100" fill="url(#ph-stripes)" />
</svg>
